 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>BEAST MODE FITNESS STUDIO — Management System</title>

  <!--
    BEAST MODE FITNESS STUDIO
    Single-file application.

    IMPORTANT:
    This file is designed to work with Supabase when the public project URL and
    anon/publishable key are configured in Settings. Never put a Supabase
    service-role key in this file.

    Expected Supabase tables:
      profiles, members, trainers, membership_plans, memberships, payments,
      expenses, attendance, workout_sessions, workout_exercises,
      studio_settings, activity_logs

    For a genuinely multi-user production deployment, the corresponding
    PostgreSQL schema + RLS + secure server-side member provisioning must exist.
    The UI intentionally refuses to pretend that an unconfigured backend is
    production-ready.
  -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    :root{
      --bg:#08090b;--panel:#111317;--panel2:#17191e;--line:#292d35;
      --text:#f5f5f5;--muted:#9ca3af;--red:#e11d2e;--red2:#ff3347;
      --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--danger:#ef4444;
      --shadow:0 18px 50px rgba(0,0,0,.34);--radius:18px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 15% 15%,rgba(225,29,46,.15),transparent 35%),
      radial-gradient(circle at 85% 80%,rgba(225,29,46,.10),transparent 30%),#08090b}
    .auth-card{width:min(460px,100%);background:rgba(17,19,23,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:32px}
    .brand{display:flex;gap:14px;align-items:center}
    .brand-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--red);font-weight:900}
    .brand-title{font-weight:950;letter-spacing:.06em}.brand-sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
    .hero{margin:30px 0}.eyebrow{color:var(--red2);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(32px,6vw,58px);line-height:.98;margin:10px 0 16px;letter-spacing:-.04em}
    h2{margin:0;font-size:24px} h3{margin:0 0 10px}.muted{color:var(--muted)}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#0b0c0f;padding:20px 14px;display:flex;flex-direction:column;z-index:20}
    .nav{display:grid;gap:6px;margin-top:24px;overflow:auto}.nav button{background:none;border:0;color:#aeb4bf;text-align:left;padding:12px 14px;border-radius:12px}
    .nav button:hover,.nav button.active{background:#191b20;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}
    .sidebar-bottom{margin-top:auto}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(8,9,11,.86);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
    .content{padding:26px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));}.two{grid-template-columns:repeat(2,minmax(0,1fr));}.three{grid-template-columns:repeat(3,minmax(0,1fr));}
    .card{background:linear-gradient(180deg,#13151a,#101216);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
    .stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.stat .value{font-size:32px;font-weight:900;margin-top:8px}.stat .accent{color:var(--red2)}
    .btn{border:1px solid var(--line);background:#181b20;color:#fff;border-radius:11px;padding:10px 14px;font-weight:800}.btn:hover{border-color:#464c58}.btn-primary{background:var(--red);border-color:var(--red)}.btn-primary:hover{background:var(--red2)}
    .btn-danger{background:#2a1215;border-color:#6e1c25;color:#ff9aa4}.btn-ghost{background:transparent}.btn-success{background:#10251a;border-color:#1e6d3c;color:#8bf0ad}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
    .field{display:grid;gap:7px}.field label{font-size:12px;color:#b8bec9;font-weight:800}.field input,.field select,.field textarea{width:100%;background:#0c0e11;border:1px solid #2b3038;color:#fff;border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span2{grid-column:1/-1}
    table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table-wrap table{min-width:760px}.table-wrap th,.table-wrap td{padding:13px 14px;border-bottom:1px solid #242830;text-align:left;white-space:nowrap}.table-wrap th{color:#9ca3af;font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#0d0f12}.table-wrap tr:last-child td{border-bottom:0}
    .badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#252932;color:#dbe0e8}.badge.green{background:#10261a;color:#8bf0ad}.badge.red{background:#301216;color:#ff9aa4}.badge.amber{background:#2d210e;color:#f8c96d}
    .empty{text-align:center;padding:42px 20px;color:var(--muted)}.empty strong{display:block;color:#fff;margin-bottom:6px}
    .toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#171a1f;border:1px solid var(--line);padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:360px}.toast.error{border-color:#7b202a}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px;z-index:80}.modal-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:#111317;border:1px solid var(--line);border-radius:22px;padding:22px}
    .mobile-nav{display:none}.danger-note{padding:12px;border-radius:12px;background:#291115;border:1px solid #64202a;color:#ffb0b7;font-size:13px}
    .success-note{padding:12px;border-radius:12px;background:#0d2116;border:1px solid #1f5f37;color:#a4f4bc;font-size:13px}
    .qr-box{display:grid;place-items:center;background:#fff;border-radius:18px;padding:18px;width:max-content;margin:auto}.qr-box canvas{display:block}
    .checkin-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(225,29,46,.18),transparent 45%),#08090b}
    .checkin-card{width:min(520px,100%);background:#111317;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
    .checkin-status{text-align:center;padding:18px;border-radius:16px;background:#0c0e11;border:1px solid var(--line);margin:16px 0}
    .big-time{font-size:42px;font-weight:950;letter-spacing:-.04em}.progress{height:8px;background:#242830;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--red);width:0}
    .mini{font-size:12px;color:var(--muted)}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.three{grid-template-columns:1fr 1fr}}
    @media(max-width:800px){.layout{display:block}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b0c0f;border-top:1px solid var(--line);z-index:50;overflow:auto}.mobile-nav button{flex:1;min-width:82px;border:0;background:none;color:#9ca3af;padding:10px 5px;font-size:10px}.mobile-nav button.active{color:#fff}.content{padding:18px 16px 92px}.topbar{padding:0 16px}.stats,.two,.three,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.page-head{align-items:flex-start;flex-direction:column}.table-wrap table{min-width:680px}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
(() => {
  "use strict";

  const STORAGE = "beast_mode_config_v1";
  const state = {
    supabase:null, session:null, profile:null, route:location.hash.replace(/^#/,"") || "dashboard",
    cache:{members:[],trainers:[],plans:[],memberships:[],payments:[],expenses:[],attendance:[],workouts:[],logs:[],settings:null},
    config: JSON.parse(localStorage.getItem(STORAGE)||"null") || {url:"",key:""},
    busy:false
  };

  const app = document.getElementById("app");
  const toast = document.getElementById("toast");
  const modal = document.getElementById("modal");

  const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  const money = n => new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n||0));
  const dateOnly = v => v ? new Date(v).toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";
  const dateTime = v => v ? new Date(v).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
  const nowISO = () => new Date().toISOString();
  const todayISO = () => new Date().toISOString().slice(0,10);
  const id = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random();
  const initials = n => (String(n||"BM").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("")||"BM").toUpperCase();

  function notify(msg, error=false){
    toast.textContent=msg; toast.classList.remove("hidden","error"); if(error) toast.classList.add("error");
    clearTimeout(notify.t); notify.t=setTimeout(()=>toast.classList.add("hidden"),3600);
  }

  function saveConfig(){
    localStorage.setItem(STORAGE,JSON.stringify(state.config));
  }

  function initSupabase(){
    if(!state.config.url || !state.config.key || !window.supabase){ state.supabase=null; return; }
    try { state.supabase=window.supabase.createClient(state.config.url,state.config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }
    catch(e){ state.supabase=null; notify("Supabase configuration is invalid.",true); }
  }

  async function db(table, opts={}){
    if(!state.supabase) throw new Error("Supabase is not configured. Open Settings → Backend.");

    // IMPORTANT: mutations must be started from the PostgREST query builder.
    // Calling .select() first changes the builder into a filter builder, which
    // does not expose .insert/.update/.upsert/.delete and causes errors such as
    // “q.insert is not a function”.
    let q=state.supabase.from(table);
    let r;

    if(opts.method==="insert") {
      r=q.insert(opts.data);
      if(opts.select!==false) r=r.select(opts.columns||"*");
    } else if(opts.method==="update") {
      r=q.update(opts.data);
      if(opts.eq) for(const [k,v] of Object.entries(opts.eq)) r=r.eq(k,v);
      if(opts.select!==false) r=r.select(opts.columns||"*");
    } else if(opts.method==="upsert") {
      r=q.upsert(opts.data);
      if(opts.select!==false) r=r.select(opts.columns||"*");
    } else if(opts.method==="delete") {
      r=q.delete();
      if(opts.eq) for(const [k,v] of Object.entries(opts.eq)) r=r.eq(k,v);
      if(opts.select!==false) r=r.select(opts.columns||"*");
    } else {
      r=q.select(opts.columns||"*");
      if(opts.eq) for(const [k,v] of Object.entries(opts.eq)) r=r.eq(k,v);
      if(opts.order) r=r.order(opts.order.column,{ascending:opts.order.asc!==false});
      if(opts.limit) r=r.limit(opts.limit);
      if(opts.single) r=r.single();
    }

    if(opts.method!=="insert" && opts.method!=="update" && opts.method!=="upsert" && opts.method!=="delete") {
      // read query already has its filters above
    }

    r=await r;
    if(r.error) throw r.error;
    return r.data;
  }

  async function logAction(action, description="", target_type=null, target_id=null){
    try{
      if(!state.supabase || !state.session) return;
      await db("activity_logs",{method:"insert",data:{actor_id:state.session.user.id,action,description,target_type,target_id,created_at:nowISO()}});
    }catch(e){console.warn("activity log",e)}
  }

  async function loadProfile(){
    if(!state.supabase || !state.session) return;
    const p=await db("profiles",{eq:{id:state.session.user.id},single:true});
    state.profile=p;
  }

  async function loadCache(){
    if(!state.supabase || !state.session) return;
    const role=state.profile?.role;
    const jobs=[];
    if(role==="owner" || role==="trainer"){
      jobs.push(db("members",{order:{column:"created_at",asc:false}}).then(x=>state.cache.members=x||[]));
      jobs.push(db("trainers",{order:{column:"created_at",asc:false}}).then(x=>state.cache.trainers=x||[]));
      jobs.push(db("membership_plans",{order:{column:"created_at",asc:false}}).then(x=>state.cache.plans=x||[]));
      jobs.push(db("memberships",{order:{column:"start_date",asc:false}}).then(x=>state.cache.memberships=x||[]));
      jobs.push(db("attendance",{order:{column:"check_in_at",asc:false},limit:500}).then(x=>state.cache.attendance=x||[]));
      jobs.push(db("workout_sessions",{order:{column:"session_date",asc:false},limit:500}).then(x=>state.cache.workouts=x||[]));
    }
    if(role==="owner"){
      jobs.push(db("payments",{order:{column:"paid_at",asc:false},limit:500}).then(x=>state.cache.payments=x||[]));
      jobs.push(db("expenses",{order:{column:"expense_date",asc:false},limit:500}).then(x=>state.cache.expenses=x||[]));
      jobs.push(db("activity_logs",{order:{column:"created_at",asc:false},limit:500}).then(x=>state.cache.logs=x||[]));
      jobs.push(db("studio_settings",{limit:1}).then(x=>state.cache.settings=x?.[0]||null));
    }
    if(role==="member"){
      // RLS should restrict these to the current member.
      jobs.push(db("members",{order:{column:"created_at",asc:false}}).then(x=>state.cache.members=x||[]));
      jobs.push(db("memberships",{order:{column:"start_date",asc:false}}).then(x=>state.cache.memberships=x||[]));
      jobs.push(db("payments",{order:{column:"paid_at",asc:false},limit:200}).then(x=>state.cache.payments=x||[]));
      jobs.push(db("attendance",{order:{column:"check_in_at",asc:false},limit:200}).then(x=>state.cache.attendance=x||[]));
      jobs.push(db("workout_sessions",{order:{column:"session_date",asc:false},limit:200}).then(x=>state.cache.workouts=x||[]));
    }
    await Promise.allSettled(jobs);
  }

  function loginView(){
    return `<div class="auth-wrap">
      <div class="auth-card">
        <div class="brand"><div class="brand-mark">BM</div><div><div class="brand-title">BEAST MODE</div><div class="brand-sub">Fitness Studio</div></div></div>
        <div class="hero"><div class="eyebrow">Operations Desk</div><h1>RUN THE FLOOR.</h1><p class="muted">Members, attendance, memberships, payments, workouts and studio operations in one system.</p></div>
        ${state.config.url ? "" : `<div class="danger-note" style="margin-bottom:14px">Backend is not configured. This single file is ready for Supabase, but production data cannot work until the project URL and publishable/anon key are configured.</div>`}
        <form id="loginForm" class="grid">
          <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username" placeholder="owner@example.com"></div>
          <div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
          <button class="btn btn-primary" type="submit">SIGN IN</button>
        </form>
        <div class="row space" style="margin-top:16px"><span class="mini">First-time owner setup is handled through Supabase Auth.</span><button class="btn btn-ghost" type="button" onclick="openSetup()">Backend setup</button></div>
      </div>
    </div>`;
  }

  function setupView(){
    return `<div class="auth-wrap"><div class="auth-card">
      <div class="brand"><div class="brand-mark">BM</div><div><div class="brand-title">BACKEND SETUP</div><div class="brand-sub">Supabase connection</div></div></div>
      <div style="height:18px"></div>
      <p class="muted">Enter your Supabase project URL and the browser-safe publishable/anon key. Never enter a service-role key here.</p>
      <div class="grid">
        <div class="field"><label>Supabase Project URL</label><input id="cfgUrl" value="${esc(state.config.url)}" placeholder="https://xxxx.supabase.co"></div>
        <div class="field"><label>Publishable / anon key</label><input id="cfgKey" value="${esc(state.config.key)}" placeholder="eyJ..."></div>
        <div class="row"><button class="btn btn-primary" onclick="saveBackend()">SAVE & CONNECT</button><button class="btn" onclick="location.hash='login';render()">BACK</button></div>
      </div>
      <div class="danger-note" style="margin-top:18px">A one-time database migration and secure member-provisioning function are still required on the Supabase project. This HTML must never contain a service-role secret.</div>
    </div></div>`;
  }

  function shell(){
    const p=state.profile||{}; const role=p.role||"member";
    const nav = role==="owner"
      ? [["dashboard","Dashboard"],["members","Members"],["attendance","Attendance"],["plans","Membership Plans"],["payments","Payments"],["expenses","Expenses"],["trainers","Trainers"],["workouts","Workouts"],["reports","Reports"],["activity","Activity Logs"],["settings","Settings"]]
      : role==="trainer"
      ? [["dashboard","Dashboard"],["members","Assigned Members"],["attendance","Attendance"],["workouts","Workouts"],["settings","My Profile"]]
      : [["dashboard","My Dashboard"],["attendance","My Attendance"],["workouts","My Workouts"],["payments","My Fees"],["settings","My Profile"]];
    const navHTML=nav.map(([r,l])=>`<button class="${state.route===r?'active':''}" onclick="go('${r}')">${l}</button>`).join("");
    return `<div class="layout">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">BM</div><div><div class="brand-title">BEAST MODE</div><div class="brand-sub">${esc(role)} portal</div></div></div>
        <nav class="nav">${navHTML}</nav>
        <div class="sidebar-bottom"><button class="btn" style="width:100%" onclick="signOut()">SIGN OUT</button></div>
      </aside>
      <main class="main">
        <header class="topbar"><div><b>${esc(state.cache.settings?.studio_name||"BEAST MODE FITNESS STUDIO")}</b><div class="mini">${esc(state.cache.settings?.tagline||"TRAIN HARD. STAY INTENSE.")}</div></div><div class="row"><span class="badge">${esc(role.toUpperCase())}</span><span class="mini">${esc(p.full_name||state.session?.user?.email||"")}</span></div></header>
        <section class="content" id="view"></section>
      </main>
      <nav class="mobile-nav">${navHTML}</nav>
    </div>`;
  }

  function dashboardView(){
    const role=state.profile?.role;
    if(role==="member") return memberDashboard();
    const members=state.cache.members, active=members.filter(m=>m.status==="active");
    const today=state.cache.attendance.filter(a=>String(a.check_in_at||"").slice(0,10)===todayISO());
    const currently=today.filter(a=>!a.check_out_at);
    const revenue=state.cache.payments.filter(p=>String(p.paid_at||"").slice(0,10)===todayISO()&&p.status==="paid").reduce((s,p)=>s+Number(p.amount||0),0);
    const expenses=state.cache.expenses.filter(e=>String(e.expense_date||"").slice(0,10)===todayISO()).reduce((s,e)=>s+Number(e.amount||0),0);
    return `<div class="page-head"><div><div class="eyebrow">Operations Desk</div><h2>Dashboard</h2><div class="muted">Live values from the connected database.</div></div><button class="btn btn-primary" onclick="go('members')">+ ADD MEMBER</button></div>
      <div class="grid stats">
        ${stat("Total Members",members.length,"")} ${stat("Active Members",active.length,"")} ${stat("Today's Check-ins",today.length,"")} ${stat("Currently Inside",currently.length,"accent")} ${stat("Today's Revenue",money(revenue),"accent")}
      </div>
      <div class="grid two" style="margin-top:16px">
        <div class="card"><div class="row space"><h3>Currently checked in</h3><span class="badge green">${currently.length}</span></div>${currently.length?`<div class="table-wrap"><table><thead><tr><th>Member</th><th>Check-in</th><th>Status</th></tr></thead><tbody>${currently.map(a=>rowAttendance(a)).join("")}</tbody></table></div>`:empty("No one is currently checked in.","Live attendance will appear here after a member checks in.")}</div>
        <div class="card"><div class="row space"><h3>Today</h3><span class="badge">${dateOnly(todayISO())}</span></div><div class="grid two">${metric("Revenue",money(revenue))}${metric("Expenses",money(expenses))}${metric("Net",money(revenue-expenses))}${metric("Attendance",today.length)}</div></div>
      </div>`;
  }

  function stat(label,value,cls=""){return `<div class="card stat"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`}
  function metric(label,value){return `<div class="card" style="padding:14px"><div class="mini">${label}</div><b style="font-size:20px">${value}</b></div>`}
  function empty(title,text){return `<div class="empty"><strong>${title}</strong>${text||""}</div>`}

  function memberDashboard(){
    const uid=state.session?.user?.id;
    const m=state.cache.members.find(x=>x.profile_id===uid||x.user_id===uid)||state.cache.members[0];
    const pays=state.cache.payments, att=state.cache.attendance, workouts=state.cache.workouts;
    const paid=pays.filter(p=>p.status==="paid").reduce((s,p)=>s+Number(p.amount||0),0);
    const open=att.find(a=>!a.check_out_at);
    return `<div class="page-head"><div><div class="eyebrow">Member Portal</div><h2>WELCOME, ${esc(m?.full_name||state.profile?.full_name||"MEMBER").toUpperCase()}</h2><div class="muted">Only your own records are shown by the database access policy.</div></div></div>
      <div class="grid stats">${stat("Member ID",m?.member_code||"—")}${stat("Attendance",att.length)}${stat("Fees Paid",money(paid))}${stat("Workouts",workouts.length)}${stat("Status",m?.status||"—")}</div>
      <div class="grid two" style="margin-top:16px">

    return `<tr><td><b>${esc(m?.member_code||a.member_id||"—")}</b><div class="mini">${esc(m?.full_name||"")}</div></td><td>${dateOnly(a.check_in_at)}</td><td>${dateTime(a.check_in_at)}</td><td>${dateTime(a.check_out_at)}</td><td>${dur}</td><td><span class="badge ${a.check_out_at?"":"green"}">${a.check_out_at?"COMPLETED":"INSIDE"}</span></td></tr>`;

  function plansView(){

  }

  function reportsView(){
    const revenue=state.cache.payments.filter(p=>p.status==="paid").reduce((s,p)=>s+Number(p.amount||0),0);
    const expenses=state.cache.expenses.reduce((s,e)=>s+Number(e.amount||0),0);

    return `<div class="page-head"><div><div class="eyebrow">Audit</div><h2>Activity Logs</h2></div></div><div class="card">${state.cache.logs.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Description</th></tr></thead><tbody>${state.cache.logs.map(l=>`<tr><td>${dateTime(l.created_at)}</td><td><span class="badge">${esc(l.action)}</span></td><td>${esc(l.description||"")}</td></tr>`).join("")}</tbody></table></div>`:empty("No activity yet.","Administrative activity will appear here.")}</div>`;

    const s=state.cache.settings||{};

  function field(name,label,value="",type="text",cls=""){return `<div class="field ${cls}"><label>${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}"></div>`}

  function renderView(){
    const v=document.getElementById("view"); if(!v)return;
    const map={dashboard:dashboardView,members:membersView,attendance:attendanceView,payments:paymentsView,expenses:expensesView,plans:plansView,trainers:trainersView,workouts:workoutsView,reports:reportsView,activity:activityView,settings:settingsView};
    v.innerHTML=(map[state.route]||dashboardView)();
    if(state.route==="settings") drawQR();

  async function render(){
    if(location.hash.replace(/^#/,"") && location.hash.replace(/^#/,"")!==state.route) state.route=location.hash.replace(/^#/,"");
    if(!state.session){
      app.innerHTML=state.route==="setup"?setupView():loginView();
      return;
    }
    app.innerHTML=shell(); renderView();
  }

  function go(r){state.route=r;location.hash=r;render();}
  window.go=go;

  async function boot(){
    initSupabase();
    if(state.supabase){
      const {data}=await state.supabase.auth.getSession(); state.session=data.session;
      state.supabase.auth.onAuthStateChange(async (_e,s)=>{state.session=s; if(s){try{await loadProfile();await loadCache()}catch(e){console.error(e)}} render()});
      if(state.session){try{await loadProfile();await loadCache()}catch(e){notify(e.message,true)}}
    }
    render();
  }

  window.openSetup=()=>{state.route="setup";location.hash="setup";render()};
  window.saveBackend=async()=>{
    state.config.url=document.getElementById("cfgUrl").value.trim().replace(/\/$/,"");
    state.config.key=document.getElementById("cfgKey").value.trim();
    saveConfig(); initSupabase();
    if(!state.supabase){notify("Could not connect. Check URL/key.",true);return}
    try{const {error}=await state.supabase.auth.getSession();if(error)throw error;notify("Supabase client configured.");location.hash="login";state.route="login";render()}catch(e){notify(e.message,true)}
  };

  document.addEventListener("submit",async e=>{
    if(e.target.id==="loginForm"){
      e.preventDefault();
      if(!state.supabase){notify("Configure Supabase first.",true);return}
      const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
      const {data,error}=await state.supabase.auth.signInWithPassword({email,password});
      if(error){notify(error.message,true);return}
      state.session=data.session; await loadProfile(); await loadCache(); state.route="dashboard";location.hash="dashboard";render(); notify("Signed in successfully.");
    }
    if(e.target.id==="settingsForm"){
      e.preventDefault();
      try{
        const payload={studio_name:document.getElementById("studio_name").value.trim(),tagline:document.getElementById("tagline").value.trim(),phone:document.getElementById("phone").value.trim(),email:document.getElementById("email").value.trim(),gst_number:document.getElementById("gst_number").value.trim(),address:document.getElementById("address").value.trim(),opening_hours:document.getElementById("opening_hours").value.trim(),updated_at:nowISO()};
        if(state.cache.settings?.id) await db("studio_settings",{method:"update",eq:{id:state.cache.settings.id},data:payload});
        else await db("studio_settings",{method:"insert",data:{...payload,id:id()}});
        await loadCache();renderView();notify("Studio settings saved.");
      }catch(e){notify(e.message,true)}
    }
  });

  window.signOut=async()=>{if(state.supabase)await state.supabase.auth.signOut();state.session=null;state.profile=null;state.cache={members:[],trainers:[],plans:[],memberships:[],payments:[],expenses:[],attendance:[],workouts:[],logs:[],settings:null};state.route="login";location.hash="login";render()};
  window.openCheckin=()=>{location.hash="checkin";state.route="checkin";renderCheckin()};

  async function renderCheckin(){
    app.innerHTML=`<div class="checkin-page"><div class="checkin-card">
      <div class="brand"><div class="brand-mark">BM</div><div><div class="brand-title">BEAST MODE</div><div class="brand-sub">Fitness Studio</div></div></div>
      <div class="hero"><div class="eyebrow">Gym attendance</div><h1 style="font-size:42px">CHECK IN.</h1><p class="muted">Identify yourself securely. Your check-in time is recorded automatically.</p></div>
      <form id="checkinForm" class="grid">
        <div class="field"><label>Member ID</label><input id="ciCode" required placeholder="BM1001" autocapitalize="characters"></div>
        <div class="field"><label>Date of birth / temporary credential</label><input id="ciSecret" required type="password" placeholder="Your DOB or password"></div>
        <button class="btn btn-primary" type="submit">VERIFY & CHECK IN</button>
      </form>
      <div id="ciResult"></div>
      <div class="row space" style="margin-top:18px"><button class="btn" onclick="location.hash='login';state.route='login';render()">STAFF / MEMBER LOGIN</button><span class="mini">Scan the permanent gym QR to return here.</span></div>
    </div></div>`;
  }

  document.addEventListener("submit",async e=>{
    if(e.target.id!=="checkinForm")return;
    e.preventDefault();
    const code=document.getElementById("ciCode").value.trim().toUpperCase();
    const secret=document.getElementById("ciSecret").value;
    const out=document.getElementById("ciResult");
    if(!state.supabase){out.innerHTML=`<div class="danger-note">Backend is not configured. The check-in cannot be recorded safely.</div>`;return}
    try{
      // This RPC is intentionally required for production. It must verify the member
      // credential server-side and create/return the attendance record using server time.
      const {data,error}=await state.supabase.rpc("member_check_in",{p_member_code:code,p_credential:secret});
      if(error) throw error;
      out.innerHTML=`<div class="success-note">Checked in successfully. ${esc(data?.message||"Your attendance has been recorded.")}</div>`;
    }catch(err){
      out.innerHTML=`<div class="danger-note">${esc(err.message||"Check-in failed.")}</div>`;
    }
  });

  window.memberCheckOut=async()=>{
    try{
      const {data,error}=await state.supabase.rpc("member_check_out");
      if(error)throw error;
      notify("Checked out successfully."); await loadCache();renderView();
    }catch(e){notify(e.message,true)}
  };

  window.expenseModal=expenseModal;
  document.addEventListener("submit",async e=>{if(e.target.id!=="expenseForm")return;e.preventDefault();try{await db("expenses",{method:"insert",data:{id:id(),category:document.getElementById("e_category").value,amount:Number(document.getElementById("e_amount").value),expense_date:document.getElementById("e_date").value,payment_method:document.getElementById("e_method").value,description:document.getElementById("e_desc").value,created_at:nowISO()}});closeModal();await loadCache();renderView();notify("Expense saved.");}catch(err){notify(err.message,true)}});

  function planModal(planId=null){const p=state.cache.plans.find(x=>x.id===planId)||{};showModal(planId?"Edit membership plan":"Add membership plan",`<form id="planForm" class="form-grid">${field("pl_name","Plan name",p.name||"")}${field("pl_price","Price",p.price||"","number")}${field("pl_days","Duration (days)",p.duration_days||30,"number")}${field("pl_active","Active",p.active===false?"false":"true")} ${field("pl_desc","Description",p.description||"","text","span2")}<input type="hidden" id="pl_id" value="${esc(planId||"")}"><div class="span2"><button class="btn btn-primary">SAVE PLAN</button></div></form>`)}
  window.planModal=planModal;
  document.addEventListener("submit",async e=>{if(e.target.id!=="planForm")return;e.preventDefault();try{const pid=document.getElementById("pl_id").value;const data={name:document.getElementById("pl_name").value.trim(),price:Number(document.getElementById("pl_price").value),duration_days:Number(document.getElementById("pl_days").value),active:document.getElementById("pl_active").value!=="false",description:document.getElementById("pl_desc").value.trim(),updated_at:nowISO()};if(pid)await db("membership_plans",{method:"update",eq:{id:pid},data});else await db("membership_plans",{method:"insert",data:{...data,id:id(),created_at:nowISO()}});closeModal();await loadCache();renderView();notify("Membership plan saved.");}catch(err){notify(err.message,true)}});

  function trainerModal(){showModal("Add trainer",`<form id="trainerForm" class="form-grid">${field("t_name","Full name","")}${field("t_phone","Phone","")}${field("t_email","Email","","email")}<div class="span2"><button class="btn btn-primary">CREATE TRAINER</button></div></form>`)}
  window.trainerModal=trainerModal;
  document.addEventListener("submit",async e=>{if(e.target.id!=="trainerForm")return;e.preventDefault();try{await db("trainers",{method:"insert",data:{id:id(),full_name:document.getElementById("t_name").value.trim(),phone:document.getElementById("t_phone").value.trim(),email:document.getElementById("t_email").value.trim(),active:true,created_at:nowISO()}});closeModal();await loadCache();renderView();notify("Trainer created.");}catch(err){notify(err.message,true)}});

  function workoutModal(){const opts=state.cache.members.map(m=>`<option value="${esc(m.id)}">${esc(m.member_code)} — ${esc(m.full_name)}</option>`).join("");showModal("Add workout",`<form id="workoutForm" class="form-grid"><div class="field"><label>Member</label><select id="w_member" required>${opts}</select></div>${field("w_date","Date",todayISO(),"date")}${field("w_title","Workout title","")}${field("w_duration","Duration (minutes)","","number")}${field("w_notes","Notes","","text","span2")}<div class="span2"><button class="btn btn-primary">SAVE WORKOUT</button></div></form>`)}
  window.workoutModal=workoutModal;
  document.addEventListener("submit",async e=>{if(e.target.id!=="workoutForm")return;e.preventDefault();try{await db("workout_sessions",{method:"insert",data:{id:id(),member_id:document.getElementById("w_member").value,session_date:document.getElementById("w_date").value,title:document.getElementById("w_title").value.trim(),duration_minutes:Number(document.getElementById("w_duration").value||0),notes:document.getElementById("w_notes").value.trim(),created_at:nowISO()}});closeModal();await loadCache();renderView();notify("Workout saved.");}catch(err){notify(err.message,true)}});

  window.viewMember=async memberId=>{
    const m=state.cache.members.find(x=>x.id===memberId);if(!m)return;
    const att=state.cache.attendance.filter(a=>a.member_id===memberId), pays=state.cache.payments.filter(p=>p.member_id===memberId), works=state.cache.workouts.filter(w=>w.member_id===memberId);
    showModal(`${esc(m.full_name)} <span class="mini">${esc(m.member_code||"")}</span>`,`
      <div class="grid two">
        <div class="card"><h3>Profile</h3><p><b>Phone:</b> ${esc(m.phone||"—")}</p><p><b>Email:</b> ${esc(m.email||"—")}</p><p><b>DOB:</b> ${dateOnly(m.date_of_birth)}</p><p><b>Gender:</b> ${esc(m.gender||"—")}</p><p><b>Joined:</b> ${dateOnly(m.joining_date)}</p><p><b>Address:</b> ${esc(m.address||"—")}</p><p><b>Emergency:</b> ${esc(m.emergency_contact||"—")} ${esc(m.emergency_phone||"")}</p></div>
        <div class="card"><h3>Live totals</h3><p>Attendance: <b>${att.length}</b></p><p>Payments: <b>${money(pays.reduce((s,p)=>s+Number(p.amount||0),0))}</b></p><p>Workouts: <b>${works.length}</b></p><p>Status: <span class="badge ${m.status==="active"?"green":"red"}">${esc(m.status||"—")}</span></p></div>
      </div>
      <div class="card" style="margin-top:16px"><h3>Attendance</h3>${attendanceTable(att)}</div>
      <div class="card" style="margin-top:16px"><h3>Payments</h3>${paymentTable(pays)}</div>`);
  };

  window.attendanceFilter=(kind)=>{const l=kind==="today"?state.cache.attendance.filter(a=>String(a.check_in_at||"").slice(0,10)===todayISO()):state.cache.attendance;const el=document.getElementById("attendanceTable");if(el)el.innerHTML=attendanceTable(l)};
  window.downloadQR=async()=>{await drawQR(true)};
  async function drawQR(download=false){
    const canvas=document.getElementById("qrCanvas");if(!canvas||!window.QRCode)return;
    const base=location.href.split("#")[0];const target=base+"#checkin";
    document.getElementById("qrText").textContent=target;
    await QRCode.toCanvas(canvas,target,{width:220,margin:2,errorCorrectionLevel:"M"});
    if(download){const a=document.createElement("a");a.download="beast-mode-gym-check-in-qr.png";a.href=canvas.toDataURL("image/png");a.click()}
  }

  window.addEventListener("hashchange",()=>{state.route=location.hash.replace(/^#/,"")||"dashboard"; if(state.route==="checkin"){renderCheckin()}else render()});

  boot();
})();
</script>
</body>
</html>
